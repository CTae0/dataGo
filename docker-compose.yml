# ── Airflow 공통 설정 (Airflow 3.3.2, LocalExecutor) ─────────────────────
# 공식 docker-compose(3.3.2)를 바탕으로 Celery·Redis·worker를 빼고 우리 DB 컨테이너를 같이 쓴다.
#   UI: http://localhost:${AIRFLOW_PORT:-8080}  (계정 airflow / airflow — 로컬 개발용)
#   DAG: ./dags, 프로젝트 코드: /opt/eodi (이 폴더 전체를 연결)
x-airflow-common: &airflow-common
  image: apache/airflow:3.3.2
  env_file:
    - path: .env
      required: false
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-eodi_local_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # 날짜 계산(지난달, 스냅샷 파일명)과 data.go.kr 한도 초기화가 모두 KST 기준
    TZ: Asia/Seoul
    PYTHONIOENCODING: utf-8
    # 수집 스크립트가 쓰는 DB 접속 (컨테이너 안에서는 db:5432)
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    PYTHONPATH: /opt/eodi
    EODI_HOME: /opt/eodi
  volumes:
    - ./dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./airflow/plugins:/opt/airflow/plugins
    - .:/opt/eodi
  user: "50000:0"
  depends_on: &airflow-common-depends-on
    db:
      condition: service_healthy

services:
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        /entrypoint airflow version
        /entrypoint airflow config list > /dev/null
        chown -R "50000:0" /opt/airflow/{logs,dags,plugins,config}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  db:
    # PostGIS(시군구 경계). postgres:16과 같은 데이터 형식이라 기존 볼륨을 그대로 쓴다
    image: postgis/postgis:16-3.5
    container_name: eodi-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eodi}
      POSTGRES_USER: ${POSTGRES_USER:-eodi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eodi_local}
      TZ: Asia/Seoul
    ports:
      # 로컬에 이미 PostgreSQL이 있을 수 있어 5433으로 연다
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 컨테이너를 처음 만들 때 번호 순서대로 실행된다 (스키마 + dim_region)
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      # 적재 SQL에서 COPY로 읽을 수 있게 data 폴더를 연결
      - ./data:/data:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eodi} -d ${POSTGRES_DB:-eodi}"]
      interval: 5s
      retries: 10

  # ── 공개용 API (FastAPI, 조회 전용) ─────────────────────────
  # 빌드: api/Dockerfile (api/ 폴더만 들어감). DB에는 컨테이너 네트워크(db:5432)로 붙는다.
  # PC 안에서 확인용으로만 127.0.0.1:8001에 연다 (개발 서버 8000과 겹치지 않게). 바깥은 아래 tunnel로만 연결.
  api:
    build: ./api
    container_name: eodi-api
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-eodi}
      POSTGRES_USER: ${POSTGRES_USER:-eodi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eodi_local}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://www.baronow.kr,https://baronow.kr,https://wherelive-phi.vercel.app,http://localhost:5173,http://localhost:4173}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── 외부 주소 (ngrok 터널 → api:8000) ───────────────────────
  # 토큰은 .env의 NGROK_AUTHTOKEN (커밋하지 않음). 도메인은 비밀이 아니라 기본값으로 둔다.
  # 화면(Vercel)의 web/.env.production VITE_API_BASE와 같은 주소여야 한다.
  tunnel:
    image: ngrok/ngrok:latest
    container_name: eodi-tunnel
    command: ["http", "api:8000", "--url", "${NGROK_DOMAIN:-headset-fretted-pang.ngrok-free.dev}", "--log", "stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
